services:
  bookit-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookit-frontend
    restart: unless-stopped
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - web

networks:
  web:
    external: true
