services:
  bookit-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookit-frontend
    restart: unless-stopped
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - web

networks:
  web:
    external: true
